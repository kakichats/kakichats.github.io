<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KakiChats | Inquiry Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 { margin-top: 0; color: #1e3c72; }
        p { color: #555; font-size: 0.95rem; margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 0.9rem; }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #0369a1; }
        .contact-direct {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: #777;
        }
        .contact-direct a { color: #25D366; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>Send an Inquiry to KakiChats</h2>
        <p>Fill in your details below and Victor Tan will get back to you.</p>

        <!-- THIS IS THE FORM THAT SENDS TO THE DATABASE -->
        <form action="https://formspree.io/f/xoejbbvb" method="POST">
            
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. John Doe" required>

            <label for="phone">Phone / WhatsApp Number</label>
            <input type="tel" id="phone" name="phone" placeholder="e.g. 012-3456789" required>

            <label for="email">Your Email Address</label>
            <input type="email" id="email" name="_replyto" placeholder="e.g. name@gmail.com" required>

            <label for="message">Message / Inquiry</label>
            <textarea id="message" name="message" rows="4" placeholder="What would you like to inquire about?" required></textarea>

            <button type="submit">Submit Inquiry</button>
        </form>

        <div class="contact-direct">
            Or WhatsApp directly: <a href="https://wa.me/60195368000" target="_blank">+60 19-536 8000</a>
        </div>
    </div>

</body>
</html>
